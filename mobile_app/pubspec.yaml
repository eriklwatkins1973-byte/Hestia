name: hestia
description: A multi-tenant, offline-first homelessness resource directory.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Supabase client (auth + database + realtime)
  supabase_flutter: ^2.3.0

  # Local caching / offline-first storage
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # State management
  flutter_riverpod: ^2.4.9

  # Navigation
  go_router: ^13.2.0

  # Networking / connectivity detection
  connectivity_plus: ^5.0.2

  # UI helpers
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.9
  url_launcher: ^6.2.4
  intl: ^0.19.0
  shimmer: ^3.0.0

  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/themes/
